<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 840" width="960" height="840" role="img" aria-label="Tablica liczby zapisów, grupy pozycji według wartości i wybór cyfr dla x = 9">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --cell:#f0efec; --cell2:#e4e3dd; --pick:#dceafb; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --cell:#2c2c2a; --cell2:#383835; --pick:#1d3350; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: var(--ink2); }
  .title { font-size: 16px; font-weight: 600; fill: var(--ink); }
  .head { font-size: 14px; font-weight: 600; fill: var(--ink); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; fill: var(--ink); }
  .tick { fill: var(--muted); font-size: 11px; }
  .bg { fill: var(--surface); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .cell { fill: var(--cell); }
  .cell2 { fill: var(--cell2); }
  .used { fill: var(--pick); stroke: var(--s1); stroke-width: 2; }
  .seg { stroke: var(--surface); stroke-width: 2; }
  .mark { fill: none; stroke: var(--s2); stroke-width: 3; }
  .accent { fill: var(--s2); font-weight: 600; }
  .chip { fill: var(--cell); stroke: var(--axis); stroke-width: 1; }
  .chosen { fill: var(--pick); stroke: var(--s1); stroke-width: 2; }
  .ok { fill: var(--s1); font-weight: 600; }
  .ink { fill: var(--ink); }
  .big { font-size: 18px; font-weight: 600; fill: var(--ink); }
</style>
