<text x="440.0" y="448" class="accent" text-anchor="middle">x = 9</text>
<text x="24" y="472">Sumy prefiksowe rozmiarów grup: wartości 0–3 zajmują pozycje 1–6, więc x = 9 ma wartość 4 (pozycje 7–10).</text>
<text x="24" y="492">Numer w grupie, od zera: k = 9 − 7 = 2. Grupa jest posortowana jak zwykłe liczby, czyli leksykograficznie po cyfrach.</text>
<line class="grid" x1="24" x2="936" y1="510" y2="510"/>
<text x="24" y="532" class="head">3. Cyfry od najstarszej: pomijamy całe poddrzewa, dopóki k jest za duże</text>
<text x="24" y="574" class="ink">pozycja 2 (waga 4)</text><text x="24" y="594">reszta 4, k = 2</text>
<rect x="240" y="552" width="220" height="60" rx="6" class="chosen"/>
<text x="252" y="570" class="ink">cyfra 0 → reszta 4</text>
<text x="252" y="587" class="mono">ways[2][4] = 3</text>
<text x="252" y="604" class="ok">k = 2 &lt; 3: bierzemy</text>
<text x="24" y="646" class="ink">pozycja 1 (waga 2)</text><text x="24" y="666">reszta 4, k = 2</text>
<rect x="240" y="624" width="220" height="60" rx="6" class="chip"/>
<text x="252" y="642" class="ink">cyfra 0 → reszta 4</text>
<text x="252" y="659" class="mono">ways[1][4] = 1</text>
<text x="252" y="676" class="tick">k ≥ 1: pomiń, k = 1</text>
<rect x="472" y="624" width="220" height="60" rx="6" class="chip"/>
<text x="484" y="642" class="ink">cyfra 1 → reszta 2</text>
<text x="484" y="659" class="mono">ways[1][2] = 1</text>
<text x="484" y="676" class="tick">k ≥ 1: pomiń, k = 0</text>
<rect x="704" y="624" width="220" height="60" rx="6" class="chosen"/>
<text x="716" y="642" class="ink">cyfra 2 → reszta 0</text>
<text x="716" y="659" class="mono">ways[1][0] = 1</text>
<text x="716" y="676" class="ok">k = 0 &lt; 1: bierzemy</text>
<text x="24" y="718" class="ink">pozycja 0 (waga 1)</text><text x="24" y="738">reszta 0, k = 0</text>
<rect x="240" y="696" width="220" height="60" rx="6" class="chosen"/>
<text x="252" y="714" class="ink">cyfra 0 → reszta 0</text>
<text x="252" y="731" class="mono">ways[0][0] = 1</text>
<text x="252" y="748" class="ok">k = 0 &lt; 1: bierzemy</text>
<text x="24" y="788" class="big">Cyfry 0, 2, 0 → wynik 20</text>
<text x="24" y="812">Pominięcie cyfry przeskakuje ways[p][reszta] liczb naraz, więc na pozycję wystarcza najwyżej 10 kroków.</text>
