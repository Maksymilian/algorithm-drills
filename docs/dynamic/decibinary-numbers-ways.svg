<text x="24" y="284" class="mono ink">ways[0][0] = 1,   ways[p][v] = Σ po d = 0..9 z ways[p−1][v − d·2^(p−1)]</text>
<text x="24" y="304">Wiersz p dokłada pozycję o wadze 2^(p−1) i cyfrę d na niej. Niebieskie pola czyta krok 3.</text>
<line class="grid" x1="24" x2="936" y1="314" y2="314"/>
<text x="24" y="344" class="head">2. Pozycje na liście grupują się według wartości; rozmiar grupy v to ways[P][v]</text>
<rect x="100" y="370" width="40" height="36" class="cell seg"/>
<text x="120.0" y="393" class="ink" text-anchor="middle">v = 0</text>
