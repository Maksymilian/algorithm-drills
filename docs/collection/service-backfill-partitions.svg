<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Plan backfillu dla danych z demo: które partycje miesięczne od 2025-09 do 2026-11 są zamrożone, otwarte, do zmiany schematu albo do poprawki, które usługi abonentów się zmieniają i kto dostaje SMS">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
        --d0:#a9a8a0; --d1:#2a78d6; --d2:#eb6834; --cell:#f0efec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#4a4a46;
          --d0:#6b6a65; --d1:#3987e5; --d2:#d95926; --cell:#2c2c2a; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: var(--ink2); }
  .title { font-size: 16px; font-weight: 600; fill: var(--ink); }
  .head { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: var(--ink); }
  .small { font-size: 11px; fill: var(--muted); }
  .chip { font-size: 10px; font-weight: 600; text-anchor: middle; }
  .on { fill: var(--surface); }
  .bg { fill: var(--surface); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .life { stroke: var(--axis); stroke-width: 3; stroke-linecap: round; }
  .frozen { fill: var(--d0); }
  .schema { fill: var(--d1); fill-opacity: 0.22; }
  .schema-t { fill: var(--d1); }
  .corr { fill: var(--d2); }
  .open { fill: none; stroke: var(--d1); stroke-width: 2; }
  .open-t { fill: var(--d1); }
  .fix { fill: var(--d2); }
  .fz { fill: var(--d0); }
  .ok { fill: var(--d2); font-weight: 700; font-size: 15px; text-anchor: middle; }
  .no { fill: var(--muted); text-anchor: middle; }
</style>
