<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Mean wait against arrivals per minute for the four strategies">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --lit:#52514e; --cell:#f0efec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --lit:#c3c2b7; --cell:#2c2c2a; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: var(--ink2); }
  .title { font-size: 16px; font-weight: 600; fill: var(--ink); }
  .head { font-size: 14px; font-weight: 600; fill: var(--ink); }
  .note { fill: var(--ink2); }
  .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  .leader { stroke: var(--muted); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .bg { fill: var(--surface); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .s1 { stroke: var(--s1); } .s2 { stroke: var(--s2); } .s3 { stroke: var(--s3); } .s4 { stroke: var(--s4); }
  .f1 { fill: var(--s1); } .f2 { fill: var(--s2); } .f3 { fill: var(--s3); } .f4 { fill: var(--s4); }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .wait { stroke: var(--ink2); stroke-width: 2; stroke-linecap: round; }
  .call { fill: var(--surface); stroke: var(--ink2); stroke-width: 2; }
  .cell { fill: var(--cell); }
  .on { fill: var(--lit); }
  .shaft { fill: none; stroke: var(--axis); stroke-width: 1; }
</style>
<rect class="bg" width="960" height="500" rx="8"/>
<text x="24.0" y="34.0" class="title" text-anchor="start">Mean wait as more people arrive: lunchtime traffic, two cars</text>
<text x="24.0" y="56.0" class="note" text-anchor="start">Each point is the average of 20 simulated hours. The wait axis is logarithmic: each gridline is about three times the one below.</text>
