# Kompiluje wszystko (razem z harnessem JMH, przez jego procesor adnotacji), uruchamia wszystkie testy,
# pakuje jar i publikuje raport z testów. Same benchmarki JMH nie są uruchamiane: trwają minuty, a ich
# wyniki na współdzielonym runnerze nic nie znaczą; lokalnie służą do tego skrypty w scripts/perf/.
#
# Po zielonym buildzie na main jar trafia do GitHub Packages jako 1.0-SNAPSHOT. Tag v1.2.3 publikuje
# wersję 1.2.3 i tworzy GitHub Release z jarem w załącznikach.
name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# nowszy push do tego samego pull requesta unieważnia starszy przebieg; na main i tagach nie przerywamy,
# żeby nie urwać publikacji w połowie
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write               # raport z testów jako osobny check przy commicie
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'          # maven.compiler.release w pom.xml
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      # check "Testy JUnit" z liczbami w podsumowaniu joba i adnotacjami w miejscu nieudanej asercji;
      # pull request z forka nie dostaje checks: write, więc tam tylko adnotacje
      - name: Test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: Testy JUnit
          annotate_only: ${{ github.event.pull_request.head.repo.fork == true }}
          detailed_summary: true
          include_time_in_summary: true
          require_tests: true

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/*.jar
          retention-days: 14

  publish:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write             # GitHub Release dla tagu
      packages: write             # mvn deploy do GitHub Packages
    steps:
      - uses: actions/checkout@v7

      # server-id "github" zgadza się z distributionManagement w pom.xml; setup-java zapisuje w
      # ~/.m2/settings.xml, że hasłem do niego jest zmienna GITHUB_TOKEN
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github

      - name: Set the release version from the tag
        if: ${{ github.ref_type == 'tag' }}
        run: >-
          mvn --batch-mode --no-transfer-progress versions:set
          -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      # testy przeszły w jobie build, więc tu ich nie powtarzamy
      - name: Deploy to GitHub Packages
        run: mvn --batch-mode --no-transfer-progress deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create a GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        run: gh release create "$GITHUB_REF_NAME" target/*.jar --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
